version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pythonpath-backend
    ports:
      - "5000:5000"
    volumes:
      - ./instance:/app/instance
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=dev-secret-key-change-in-production
      - JWT_SECRET_KEY=jwt-secret-key-change-in-production
      - DATABASE_URL=sqlite:////app/instance/pythonpath.db
      - CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost:5000
    restart: unless-stopped

  # Frontend (простой HTTP сервер для статики)
  frontend:
    image: nginx:alpine
    container_name: pythonpath-frontend
    ports:
      - "8000:80"
    volumes:
      - ./:/usr/share/nginx/html
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
    driver: local
